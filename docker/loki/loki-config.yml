# Single-binary Loki, filesystem storage — dev-only sizing.
# boltdb-shipper keeps the index local; chunks live on the same volume.
# Good for a single Compose host; not for HA.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory:  /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Bound the per-stream retention — without these, Promtail can DoS Loki
# with high-cardinality labels under burst.
limits_config:
  # 30d window is wider than the dev retention because Promtail backfills from
  # whatever container log files were already on disk when we attached; without
  # this the first run drowns in 400s replaying weeks of compose history.
  reject_old_samples: true
  reject_old_samples_max_age: 720h
  max_query_series: 5000
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  retention_period: 168h        # 7d — plenty for dev / incident review

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
