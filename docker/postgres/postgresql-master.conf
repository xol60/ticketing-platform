listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
wal_level = replica
max_wal_senders = 5
wal_keep_size = 64
hot_standby = on
synchronous_commit = on
max_connections = 400
shared_buffers = 256MB
effective_cache_size = 512MB
log_min_duration_statement = 500
# Capacity sizing — 9 services × ~30 connections (20 master pool + 10 slave pool) ≈ 270.
# Headroom to 400 leaves room for ad-hoc psql sessions, migrations, and reservation watchdogs.
