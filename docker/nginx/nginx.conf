worker_processes auto;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" trace="$http_x_trace_id" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Slow-loris defenses ──────────────────────────────────────────────────
    # Drop clients that send headers/body too slowly — a classic slow-loris
    # signature is opening a connection and trickling out 1 byte every 30s
    # to tie up worker threads indefinitely. These timeouts enforce a
    # minimum effective request speed.
    client_header_timeout      10s;    # entire request header must arrive within 10s
    client_body_timeout        10s;    # each chunk of request body must arrive within 10s
    send_timeout               10s;    # each chunk of response must be acked within 10s
    reset_timedout_connection  on;     # send RST instead of FIN — frees kernel resources faster
    client_header_buffer_size  1k;     # tiny header buffer; oversized headers rejected fast
    large_client_header_buffers 4 8k;  # cap on legitimate large headers (e.g. big cookies)

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=global:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream api_gateway {
        server api-gateway:8090;
        keepalive 64;
    }

    upstream ticketing_ui {
        server ticketing-ui:80;
        keepalive 16;
    }

    # ── Server ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;
        # ── Connection cap per IP — primary slow-loris defense ───────────────
        # Lowered from 100 → 20. A single attacker IP could previously hold 100
        # connections open; combined with slow trickle of bytes, that's enough
        # to exhaust a worker. 20 is generous for legitimate users (browsers
        # typically use 6–8 simultaneous connections per origin) and tight
        # enough that 100 attacker IPs are required to occupy 2000 connections
        # — comparable to a real DDoS budget, not a single laptop.
        limit_conn conn 20;
        limit_req  zone=global burst=50 nodelay;

        # ── Auth API — strict rate limit ──────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api_gateway;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # ── REST API → gateway ────────────────────────────────────────────────
        # ── Recommendation agent — long read timeout ─────────────────────────
        # A turn costs an LLM call plus embeddings on a locally-hosted model:
        # 3-5 s warm. The first request after Ollama unloads an idle model has
        # to reload ~5 GB of weights and takes closer to a minute, which the
        # generic 30 s below would cut off — producing a 504 on exactly the
        # request a first-time visitor makes.
        #
        # Longest-prefix match wins in nginx, so this beats /api/ regardless of
        # block order.
        location /api/agent/ {
            proxy_pass         http://api_gateway;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_connect_timeout   5s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── SSE streams — disable buffering so events flush immediately ───────
        location ~* /api/.*/stream {
            proxy_pass             http://api_gateway;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_http_version     1.1;
            proxy_set_header       Connection "";
            # Critical for SSE: disable proxy buffering
            proxy_buffering        off;
            proxy_cache            off;
            proxy_read_timeout     3600s;
            chunked_transfer_encoding on;
        }

        # ── Gateway health probe ──────────────────────────────────────────────
        location /actuator/ {
            proxy_pass         http://api_gateway;
            proxy_set_header   Host              $host;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            access_log off;
        }

        # ── React SPA — all other routes ──────────────────────────────────────
        location / {
            proxy_pass         http://ticketing_ui;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
