spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOriginPatterns: "*"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
            allowedHeaders: "*"
            allowCredentials: true

server:
  port: 8090
  netty:
    connection-timeout: 10s

# ── Gateway properties ─────────────────────────────────────────────────────────
gateway:
  jwt:
    secret: ${JWT_SECRET:changeme_use_a_real_secret_in_production_256bits}
    access-token-expiry-seconds: 900
    refresh-token-expiry-seconds: 604800
  rate-limit:
    # Master switch. Set GATEWAY_RATE_LIMIT_ENABLED=false to bypass the limiter
    # entirely (bulk seeding / dev). Re-enable (true / unset) before production.
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-second: 20
    burst-capacity: 40
    window-seconds: 60
    path-overrides:
      # Tight bucket on auth endpoints (login/refresh) — protects against
      # credential stuffing.
      /api/auth: 5
      # Tightest bucket on the platform. Every agent turn costs an LLM call
      # and one or more embedding calls on a single-threaded local model —
      # this is the most expensive endpoint here by an order of magnitude, and
      # unlike search it cannot be absorbed by a cache. Two per second is
      # already faster than a person types a full request.
      /api/agent: 2
      # Generous bucket on search endpoints. Autocomplete-as-you-type is
      # naturally bursty (one typist ≈ 3-4 req/s after debounce). With the
      # default 20 r/s per (IP, userId) bucket, all anonymous users sharing
      # one NAT'd IP collectively get only 20 r/s — five concurrent
      # typists fill the bucket and the rest get 429s.
      #
      # 60 r/s gives ~15-20 simultaneous typists per shared IP. ES is
      # already protected by the search-service Caffeine cache, so letting
      # more requests through here is cheap.
      #
      # Still bounded — well below nginx's 200 r/s per-IP ceiling, so a
      # malicious key-holder hits that wall before doing real damage.
      /api/search: 60
  circuit-breaker:
    failure-rate-threshold: 50
    slow-call-rate-threshold: 80
    slow-call-duration-seconds: 3
    permitted-calls-in-half-open: 3
    wait-duration-in-open-seconds: 30
    sliding-window-size: 20
  cache:
    l1-ttl-seconds: 30
    l1-max-size: 5000
    l2-ttl-seconds: 300
  public-paths:
    # The two conversational endpoints only, not the whole namespace. A prefix
    # here short-circuits auth AND the role gate below, so "/api/agent/" made
    # every future endpoint under it public by default — including writes.
    - /api/agent/search      # agent turn is a POST, so publicGetPaths cannot cover it
    - /api/agent/chat
    - /api/auth/login
    - /api/auth/register
    - /api/auth/refresh
    - /actuator/health
    - /actuator/circuit-breakers
    - /health
  # GET-only browse paths — no auth needed to read, but POST/PATCH/DELETE on
  # the same prefix still require a token (and may require ADMIN role).
  public-get-paths:
    - /api/tickets/events       # list events + per-event ticket list (Phase 3b)
    - /api/tickets              # /api/tickets/{id} and event-scoped listings
    - /api/search/              # multi-field search + autocomplete
    - /api/secondary/listings   # browse the resale market
    - /api/pricing/rules        # current surge multiplier per event

# ── Actuator ───────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuit-breakers
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ── Logging ────────────────────────────────────────────────────────────────────
logging:
  level:
    com.ticketing.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# ── Docker profile ─────────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: redis
      port: 6379

logging:
  level:
    com.ticketing.gateway: INFO

---
# ── Local dev profile ──────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: localhost
      port: 6379
