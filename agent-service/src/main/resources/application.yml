spring:
  application:
    name: agent-service

  datasource:
    # Single datasource on purpose — no master/slave routing here.
    # Routing reads to the replica would let a just-approved event stay
    # invisible for the length of replication lag, which is exactly the moment
    # a reviewer is checking whether their approval worked. The read volume on
    # this service is bounded by LLM throughput anyway, so the replica would be
    # solving a problem that cannot occur.
    url:      ${DB_URL:jdbc:postgresql://localhost:5436/agent_db}
    username: ${DB_USER:ticketing}
    password: ${DB_PASSWORD:ticketing_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

server:
  port: 8092

# ── Agent subsystem ──────────────────────────────────────────────────────────
agent:
  # Both models run locally in Ollama. Nothing leaves the host: the project
  # clones and runs with no API key, and no event data reaches a third party.
  #
  # The cost of that is an 8B model that fabricates readily and fluently — a
  # made-up facet reads exactly like a real one. Everything under `validation`
  # below exists because of it.
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

    llm:
      model: ${OLLAMA_LLM_MODEL:qwen3:8b}
      # Zero, always. Ingestion is extraction, not writing — the same
      # description must produce the same facets every run, or re-ingesting an
      # event refills the review queue with decisions already made.
      temperature: 0.0
      num-ctx: 8192
      # Qwen3 emits <think> blocks unless told not to; they break schema-
      # constrained decoding and cost tokens on a transcription task.
      think: false
      connect-timeout-ms: 2000
      # Local CPU inference can take a minute per event. Not user-facing at
      # ingestion time, and a spurious timeout costs a full re-extraction.
      read-timeout-ms: 180000
      max-schema-retries: 2

    embedding:
      model: ${OLLAMA_EMBED_MODEL:bge-m3}
      # Must match vector(N) in the migrations. bge-m3 is 1024 wide, which is
      # why the schema was written at 1024.
      dimension: 1024
      # bge-m3 needs no instruction prefix. Kept configurable because most
      # alternatives do — nomic-embed-text requires search_query:/search_
      # document:, and omitting them degrades every comparison silently.
      query-prefix: ""
      document-prefix: ""
      connect-timeout-ms: 2000
      read-timeout-ms: 60000

  # Gates every extracted facet passes before it can affect a search result.
  # Ordered cheapest-and-most-decisive first: the deterministic gates need no
  # vector and no model, so most fabrication dies before anything is embedded.
  validation:
    # Share of the facet's content words that must also appear — after
    # stemming — in the span it cites. Below 1.0 on purpose: a good facet
    # rephrases rather than copies.
    min-span-overlap: 0.34
    # Spans shorter than this are too generic to be evidence of anything.
    min-span-chars: 12
    # Facet value unlike anything approved on that dim before — usually
    # atmosphere content written into the format slot. Goes to review, not
    # dropped: the dim may simply be new.
    dim-threshold: 0.60
    # Tag label this far from every known tag becomes a proposal instead of
    # snapping. High on purpose — a wrong snap is invisible, an unsnapped
    # label sits in a queue where someone sees it.
    tag-snap-threshold: 0.82
    # Note what is NOT here: any use of the model's self-reported confidence.
    # An 8B model reports 0.95 for a fabricated facet as readily as a sound
    # one, so trusting it would launder the exact failure these gates catch.
    auto-approve-on-all-gates-pass: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ticketing.agent: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} traceId=%X{traceId} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres-master:5432/agent_db
  data:
    redis:
      host: redis
  kafka:
    bootstrap-servers: kafka:9092

agent:
  ollama:
    base-url: http://ollama:11434

logging:
  level:
    com.ticketing.agent: INFO

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5436/agent_db
  data:
    redis:
      host: localhost
  kafka:
    bootstrap-servers: localhost:29092
